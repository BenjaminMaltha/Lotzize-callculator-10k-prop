name: Nieuwskalender bijwerken

on:
  schedule:
    - cron: "17 */3 * * *"   # elke 3 uur
  workflow_dispatch:          # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalender ophalen (Forex Factory, deze week)
        run: |
          curl -fsSL -A "Mozilla/5.0 (risk-desk calendar)" \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json -o calendar.new.json
          python3 -c "import json; d=json.load(open('calendar.new.json')); assert isinstance(d, list) and len(d) > 0"
          mv calendar.new.json calendar.json
      - name: Opslaan in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || (git commit -m "Nieuwskalender bijwerken" && git push)
